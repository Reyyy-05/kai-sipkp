services:
  postgres:
    image: postgres:15-alpine
    container_name: sipkp-postgres
    restart: always
    environment:
      POSTGRES_USER: sipkp_user
      POSTGRES_PASSWORD: sipkp_pass
      POSTGRES_DB: sipkp_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
